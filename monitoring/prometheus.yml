global:
  scrape_interval: 15s

scrape_configs:
  # Scrape Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape du backend Flask
  - job_name: 'flask-backend'
    metrics_path: /metrics    # endpoint exposé par prometheus-flask-exporter
    static_configs:
      - targets: ['backend:5000']   # correspond au service "backend" dans docker-compose
