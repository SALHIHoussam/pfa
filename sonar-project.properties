# =======================================================
# SONARQUBE PROJECT CONFIGURATION
# =======================================================

# Identification du projet
sonar.projectKey=pfa
sonar.projectName=PFA-Project
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# =======================================================
# SOURCES
# =======================================================

# Répertoires à analyser
sonar.sources=backend,frontend/src

# Exclusions (évite d'analyser venv, node_modules, fichiers binaires, etc.)
sonar.exclusions=backend/.venv/**,backend/venv/**,backend/**/__pycache__/**,frontend/node_modules/**,**/migrations/**,**/*.pyd,**/*.exe,**/*.dll,**/*.pfb,**/*.png,**/*.ttf,**/*.bin,**/zoneinfo/**

# =======================================================
# BACKEND (Python / Flask)
# =======================================================
sonar.language=python
sonar.python.version=3.12

# Rapport de couverture (généré par pytest-cov)
sonar.python.coverage.reportPaths=backend/coverage.xml

# =======================================================
# FRONTEND (React / JavaScript)
# =======================================================
# Rapport de couverture (généré par Jest)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
