version: '3.8'

services:
  backend:
    build: ./backend
    image: salhihoussam/backend:latest
    container_name: flask-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=production  # Changez ceci
    restart: unless-stopped  # Ajoutez cette ligne

  frontend:
    build: ./frontend
    image: salhihoussam/frontend:latest
    container_name: react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped  # Ajoutez cette ligne
