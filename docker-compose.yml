version: '3.8'

services:
  backend:
    build: ./backend
    image: salhihoussam/backend:latest
    container_name: flask-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: salhihoussam/frontend:latest
    container_name: react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    ports:
      - "8081:8081"
      - "5001:5001"
    volumes:
      - pfa_project_nexus-data:/nexus-data
    restart: unless-stopped

  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONARQUBE_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonar
    depends_on:
      - db
    volumes:
      - pfa_project_sonarqube-data:/opt/sonarqube
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - pfa_project_sonarqube-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pfa_project_nexus-data:
  pfa_project_sonarqube-data:
  pfa_project_sonarqube-db-data:
