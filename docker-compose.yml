version: '3.8'

services:
  backend:
    build: ./backend
    image: salhihoussam/backend:latest
    container_name: flask-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: salhihoussam/frontend:latest
    container_name: react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    ports:
      - "8081:8081" # Interface web
      - "5001:5001" # Docker registry
    volumes:
      - nexus-data:/nexus-data
    restart: unless-stopped

volumes:
  pfa_project_nexus-data:
